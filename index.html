<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mensagem Especial</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
}

/* CORAÇÕES SUBINDO */
.heart {
  position: fixed;
  bottom: -20px;
  color: #ff3860;
  font-size: 20px;
  animation: subir 4s linear infinite;
  opacity: 0.8;
  pointer-events: none;
}

@keyframes subir {
  0% { transform: translateY(0) scale(1); opacity: 0.9; }
  100% { transform: translateY(-120vh) scale(1.8); opacity: 0; }
}

.start {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: none;
  border: none;
  cursor: pointer;
  z-index: 10;
}

.dog-emoji {
  font-size: 80px;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border-radius: 50%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  animation: pulse 1.5s infinite ease-in-out;
  transition: transform .3s;
}

.dog-emoji:hover { transform: scale(1.1); }

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.card {
  display: none;
  max-width: 90%;
  width: 380px;
  padding: 35px 25px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 20px;
  backdrop-filter: blur(12px);
  border: 2px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  animation: abrirCaixa 0.8s ease forwards;
  transform-origin: top;
}

@keyframes abrirCaixa {
  0% { transform: scaleY(0); opacity: 0; }
  100% { transform: scaleY(1); opacity: 1; }
}

h1 {
  color: #d14d72;
  font-size: 28px;
  margin-bottom: 15px;
  font-weight: bold;
  text-shadow: 0 1px 3px rgba(0,0,0,0.15);
  min-height: 35px;
  border-right: 2px solid #d14d72;
  width: fit-content;
  margin: 0 auto;
  white-space: nowrap;
  overflow: hidden;
}

.texto-fixo {
  font-size: 16px;
  color: #ffffff;
  margin-top: 10px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}

p {
  font-size: 20px;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  margin-top: 20px;
  min-height: 50px;
}

.btn {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  background: #d14d72;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

.btn:hover {
  background: #b73b5e;
  transform: translateY(-2px);
}
</style>
</head>
<body>

<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (20 + Math.random() * 30) + "px";
  heart.style.animationDuration = (3 + Math.random() * 2) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}, 400);

document.addEventListener("click", (e) => {
  // Impede que o clique crie corações no botão que já tem sua própria função
  if(e.target.id === 'startBtn') return;
  
  const boom = document.createElement("div");
  boom.classList.add("heart");
  boom.innerHTML = "💖";
  boom.style.left = e.clientX + "px";
  boom.style.top = e.clientY + "px";
  boom.style.bottom = "auto";
  boom.style.position = "absolute";
  boom.style.animationDuration = (1 + Math.random()) + "s";
  boom.style.fontSize = (15 + Math.random() * 25) + "px";
  document.body.appendChild(boom);
  setTimeout(() => boom.remove(), 2000);
});

const frases = [
"Eu amo quando você joga a cabeça pro lado pra tirar o cabelo dos olhos… é um gesto tão simples, mas eu acho a coisa mais linda do mundo.",
"Eu acho muito daora quando você faz aquela mini dancinha quando come algo que gosta muito. Seu jeitinho espontâneo me faz sorrir na hora.",
"Eu amo o jeito que você me encara. Seus olhos me dão uma sensação que eu nunca senti antes, é como se tudo ao redor simplesmente sumisse.",
"Eu amo o seu cheiro. Se eu pudesse, ficava horas só ali, pertinho, sentindo você.",
"Sempre que você me pergunta “por queee?” desse seu jeito, eu fico até perdido, esqueço o que eu tava fazendo.",
"Vitória’ é conquista — e você é a mais linda que eu poderia ter.",
"Se eu fosse te definir com código: vitoria = infinito.",
"Eu poderia escrever mil códigos, mas nenhum explicaria o quanto você é incrível.",
"Eu amo como sua voz suaviza toda vez que vai falar comigo, é como se você tivesse um tom de voz diferente para falar comigo.",
"Você é meu conto favorito, Mor. É tipo um universo infinito que eu acordo todo dia querendo explorar um pouco mais. Ainda tenho muito o que aprender sobre você, mas cada pedacinho desse seu mundo que eu descubro me faz ter certeza que eu quero ficar aqui pra sempre.",
"Sabe a rosa do Pequeno Príncipe? Ele cuidava dela como se fosse o tesouro mais raro do mundo. Com você eu me sinto assim. Quero te proteger de todo o 'vento forte' e de qualquer coisa que tente tirar seu sorriso. Você é o meu universo e eu vou sempre cuidar do que é nosso.",
"Sabe o que eu mais amo? Aquele seu cheirinho que fica em mim depois que a gente se vê. Me traz uma paz que eu nem sei explicar, parece que o mundo lá fora para e tudo fica bem. É meu porto seguro real.",
"Eu amo o jeito que você me olha, parece que você consegue ler o que eu tô sentindo sem eu precisar falar nada.",
"Engraçado como antes de você eu achava que sabia o que era paz, mas agora eu sei que a paz tem o seu nome.",
"Eu quero ser o seu porto seguro, o lugar onde você pode soltar todo o peso do mundo e só descansar.",
"O mundo lá fora é barulhento demais, mas o seu abraço é o único lugar que tem o silêncio e a paz que eu preciso.",
"Percebi que seus olhos têm ficado mais bonitos, difícil não se hipnotizar por eles.",
"Fico me perguntando por que seu cabelo me chama tanta atenção, eu não entendo o porquê do meu fascínio por ele.",
"Às vezes, quando eu fecho os olhos, eu me lembro de você sentada em cima da mesa de conferência balançando as pernas. É uma imagem que me traz uma certa paz e felicidade que eu não sei explicar.",
"Faz um tempo que os lírios me lembram você. Exatamente como acontece no encontro do Pequeno Príncipe e a raposa, percebi que você me cativou de verdade.",
"As noites estreladas ganharam um novo sentido para mim por sua causa. Observar o céu virou meu hábito favorito, porque é lá que eu reencontro as lembranças dos nossos melhores momentos.",
"Não são só os lírios ou o céu noturno que me trazem você à memória. A verdade é que eu acabo encontrando um pedacinho de você em tudo aquilo que é bonito.",
"Existem músicas, ventos e cheiros que parecem ter o seu nome. Você tem esse dom incrível de se fazer presente no meu dia, mesmo quando estamos longe.",
"Às vezes me pego sorrindo sem motivo aparente. Quando vou ver, é só a minha mente que viajou no tempo e parou em alguma lembrança boa da gente.",
"Dizem que a diferença entre o veneno e o remédio está apenas na dose. Se a Maomao me avaliasse, diria que me deixei inebriar completamente por você. Mas a verdade é que, para qualquer dia ruim, você tem sido o meu melhor antídoto.",
"Se estivéssemos naquele banquete no Palácio, eu não pensaria duas vezes antes de te entregar o meu grampo de cabelo. Porque de todas as pessoas do mundo, é com você que eu faço questão de criar um laço verdadeiro.",
"A Maomao tem o dom de enxergar a verdadeira essência e o significado de cada flor e de cada erva. Acho que você despertou algo parecido em mim: hoje eu reparo nos lírios e no céu estrelado de um jeito diferente, porque neles eu sempre encontro um pouco de você.",
"Assim como a Maomao enxerga muito além daquela 'beleza celestial' do Jinshi, o que me cativou não foi só o que todo mundo vê em você. Foi a sua essência, a nossa conexão e todos os momentos bons que vivemos juntos.",
"Você sabe que eu gosto muito de você, né? É um nível de fascínio que quase se compara ao brilho nos olhos da Maomao quando ela descobre um veneno novo ou uma erva rara.",
"Nunca fui fã de ir ao cinema por não gostar de lugares lotados, mas a sua presença transforma qualquer ambiente. Quando estou com você, o lugar cheio deixa de incomodar. Sua companhia é tão boa que faz até um filme ruim valer a pena.",
"A verdade é que eu não ligo para o cinema cheio ou se o filme não é lá essas coisas. O que me faz querer ir é só a vontade de estar com você. Passar esse tempo do seu lado e a gente dividir um sushi se tornou, de longe, o meu programa favorito.",
"Sabe de uma coisa, Vitória? Comer sushi é bom, mas comer sushi com você tem um sabor totalmente diferente. Acho que já nem é mais sobre a comida, é sobre aquele nosso momento, a gente conversando. É de longe uma das minhas coisas favoritas.",
"Toda vez que me dá vontade de comer sushi, eu percebo que, na verdade, é vontade de passar um tempo com você."
];

// Cria uma cópia da lista de frases para sabermos quais ainda não foram lidas
let frasesDisponiveis = [...frases];

function novaFrase() {
  // Se as frases disponíveis acabarem, recarrega a lista completa
  if (frasesDisponiveis.length === 0) {
    frasesDisponiveis = [...frases];
  }

  // Sorteia um número baseado apenas na quantidade de frases que ainda restam
  const indexSorteado = Math.floor(Math.random() * frasesDisponiveis.length);
  
  // Pega a frase sorteada e a remove da lista de disponíveis (usando splice)
  const escolhida = frasesDisponiveis.splice(indexSorteado, 1)[0];
  
  // Exibe a frase na tela
  document.getElementById('frase').innerText = escolhida;
}

function digitar(texto, elemento, velocidade = 70) {
  elemento.textContent = "";
  let i = 0;
  function escrever() {
    if (i < texto.length) {
      elemento.textContent += texto.charAt(i);
      i++;
      setTimeout(escrever, velocidade);
    }
  }
  escrever();
}

function coracoesExplodindoCentro() {
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = "50vw";
    heart.style.top = "50vh";
    heart.style.bottom = "auto";
    heart.style.position = "fixed";
    heart.style.animationDuration = (1 + Math.random()) + "s";
    heart.style.fontSize = (20 + Math.random() * 40) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('startBtn').onclick = () => {
    const card = document.querySelector('.card');
    const titulo = document.getElementById('titulo');

    document.getElementById('startBtn').style.display = 'none';
    card.style.display = "block";

    card.style.animation = "none";
    void card.offsetWidth;
    card.style.animation = "abrirCaixa 0.8s ease forwards";

    setTimeout(() => coracoesExplodindoCentro(), 300);

    digitar("Oi Vitória ❤️", titulo, 160);
    
    setTimeout(novaFrase, 1500);
  };
});
</script>

<button id="startBtn" class="start" aria-label="Abrir mensagem surpresa">
<span class="dog-emoji">🐶</span>
</button>

<div class="card">
<h1 id="titulo"></h1>
<p class="texto-fixo">
Criei este site para guardar todos os detalhes que eu amo em você. Cada vez que percebo algo que me encanta — por menor que seja — eu venho aqui e acrescento.<br><br>
É o meu jeito de eternizar esses momentos e, quem sabe, arrancar mais um sorriso seu.
</p>
<button onclick="novaFrase()" class="btn">Nova frase</button>
<p id="frase"></p>
</div>
</body>
</html>
